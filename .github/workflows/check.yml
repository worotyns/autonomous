# The same check the board runs before a PR. Keep `make check` offline and non-interactive.
name: check
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency: { group: "check-${{ github.ref }}", cancel-in-progress: true }

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: make setup && make check
