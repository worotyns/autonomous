# Merge to main -> next semver tag -> GitHub release -> image build (+ deploy) in the SAME workflow.
# (A tag pushed with GITHUB_TOKEN does not start other workflows, so the build cannot live in an on:tag workflow.)
# Bump: label on the merged PR `release:major` / `release:minor`, default patch; `release:none` skips.
name: release
on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write
  pull-requests: read

concurrency: { group: release, cancel-in-progress: false }

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: version
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          labels=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0].labels[].name' || true)
          if echo "$labels" | grep -qx 'release:none'; then echo "skip"; exit 0; fi
          last=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1); last=${last:-v0.0.0}
          IFS=. read -r ma mi pa <<<"${last#v}"
          if   echo "$labels" | grep -qx 'release:major'; then ma=$((ma+1)); mi=0; pa=0
          elif echo "$labels" | grep -qx 'release:minor'; then mi=$((mi+1)); pa=0
          else pa=$((pa+1)); fi
          echo "tag=v$ma.$mi.$pa" >> "$GITHUB_OUTPUT"
      - if: steps.version.outputs.tag != ''
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "${{ steps.version.outputs.tag }}" --target "${{ github.sha }}" --generate-notes

  image:
    needs: release
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: hashFiles('Dockerfile') != ''
        uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ github.token }}" }
      - if: hashFiles('Dockerfile') != ''
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.release.outputs.tag }}
            ghcr.io/${{ github.repository }}:latest

  # deploy:
  #   needs: [release, image]
  #   runs-on: ubuntu-latest
  #   steps:
  #     - run: echo "deploy ghcr.io/${{ github.repository }}:${{ needs.release.outputs.tag }}"   # per repo
